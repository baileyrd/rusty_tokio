[package]
name = "rusty_tokio-macros"
version = "0.1.0"
edition = "2021"
description = "Proc-macro attributes (#[main], #[test]) for rusty_tokio -- not meant to be depended on directly, use rusty_tokio's re-exports."
license = "MIT"

[lib]
proc-macro = true

# No dependencies. This crate used to pull `syn` (with `features =
# ["full"]`), `quote`, and `proc-macro2`; it now builds on the
# compiler-provided `proc_macro` crate alone. See the crate docs' "Why no
# syn/quote/proc-macro2" section for why that trade came out differently
# here than it does for most proc-macro crates -- the short version is that
# this macro rejects generics and arguments rather than parsing them, so
# there is no arbitrary signature to parse. Issue #268.
[dependencies]
